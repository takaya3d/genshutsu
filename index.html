  ol { list-style: none; }
  ol li { margin-bottom: 1.6em; }
  ol a {
    color: var(--kinari);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--kin) 40%, transparent);

  ol a:hover { border-color: var(--kin); }
  .date {
